CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# KSN-1 central conf 에도 있는 설정. wakeup-source 와 함께 GPIO 웨이크업이
# 디바이스로 제대로 등록되지 않아 "페어링은 되지만 정상 연결 안 됨" 문제를
# 해결했던 조합 - peripheral battery GATT 교환도 같은 원인일 가능성이 있어 추가.
CONFIG_PM_DEVICE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Undefaulted int Kconfig defaults to 0, and central_bas_proxy.c drops any
# peripheral battery event whose index >= this value - with only one
# peripheral (index 0), leaving this unset silently discarded every update.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
# 이 LED(ble_led / indicator-led)는 이제 커스텀 드라이버(config/src/ksn2_conn_status.c)가
# 전담합니다. poor-man's 위젯은 zmk_ble_active_profile_changed(프로필 전환) 이벤트에서만
# 반짝이고 끝나는 구조라 실제 연결 끊김을 반영하지 못했고(연결 여부와 무관하게 계속
# 켜진 채로 있던 원인), 부팅 시 배터리 블링크 기능은 같은 핀을 두 드라이버가 동시에
# 건드리면 안 되기 때문에(KSN-1과 동일 사유) 포기하고 뺐습니다.
CONFIG_INDICATOR_LED_WIDGET=n
