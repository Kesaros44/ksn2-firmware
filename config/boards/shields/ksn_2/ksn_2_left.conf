CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# KSN-1 central conf 에도 있는 설정. wakeup-source 와 함께 GPIO 웨이크업이
# 디바이스로 제대로 등록되지 않아 "페어링은 되지만 정상 연결 안 됨" 문제를
# 해결했던 조합 - peripheral battery GATT 교환도 같은 원인일 가능성이 있어 추가.
CONFIG_PM_DEVICE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Undefaulted int Kconfig defaults to 0, and central_bas_proxy.c drops any
# peripheral battery event whose index >= this value - with only one
# peripheral (index 0), leaving this unset silently discarded every update.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
# 이 LED(ble_led / indicator-led)는 이제 커스텀 드라이버(config/src/ksn2_conn_status.c)가
# 전담합니다. poor-man's 위젯은 zmk_ble_active_profile_changed(프로필 전환) 이벤트에서만
# 반짝이고 끝나는 구조라 실제 연결 끊김을 반영하지 못했고(연결 여부와 무관하게 계속
# 켜진 채로 있던 원인), 부팅 시 배터리 블링크 기능은 같은 핀을 두 드라이버가 동시에
# 건드리면 안 되기 때문에(KSN-1과 동일 사유) 포기하고 뺐습니다.
CONFIG_INDICATOR_LED_WIDGET=n

# ============================================================================
# 유선(USB) 연결 시 회사 보안 프로그램 호환성 (ksn1-firmware와 동일 조치, 2026-09-05)
# ----------------------------------------------------------------------------
# 대상: 키보드 보안 모듈(TouchEn nxKey, AhnLab Online Security, nProtect
# KeyCrypt 등)과 매체제어/DLP 에이전트. KSN-2는 central이 왼쪽이라(KSN-1과 반대)
# CONFIG_ZMK_USB가 ZMK_SPLIT_ROLE_CENTRAL에 의존하는 이 프로젝트에서 USB HID로
# 열거되는 쪽은 왼쪽뿐 - 그래서 이 설정들은 ksn_2_left.conf에만 둠.

# 1) 6키 롤오버(HKRO) 고정 - 표준 부트 키보드와 동일한 리포트 구조.
#    NKRO는 리포트 형식이 비표준이라 보안 후킹 드라이버가 키를 놓치는
#    대표적인 원인. 기본값이지만 나중에 실수로 바뀌지 않게 명시함.
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6

# 2) USB 부트 프로토콜 지원 - BIOS/UEFI와 부트 프로토콜만 이해하는
#    저수준 필터 드라이버에서도 인식되게 함.
CONFIG_ZMK_USB_BOOT=y

# 3) 컨슈머 리포트를 BASIC(8비트 usage)으로 축소 - 디스크립터가 단순해져
#    후킹 드라이버 호환성이 올라감. 현재 키맵이 쓰는 컨슈머 키
#    (C_VOL_UP/DN, C_MUTE, C_PREV/PP/NEXT, C_BRIGHTNESS_INC/DEC)는 전부
#    0xFF 이하라 BASIC 범위 안에 들어감.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# 4) USB 장치 식별 정보 - 사내 매체제어 담당자가 화이트리스트에 등록하기
#    쉽도록 제조사/제품 문자열과 VID/PID를 이 키보드 전용 값으로 지정.
#    VID 0x1209는 pid.codes의 오픈소스 공용 VID. PID 0x4B54는 아직
#    pid.codes에 등록되지 않은 임시값(KSN-1은 0x4B53을 씀 - 서로 겹치지
#    않게 순번만 다르게 배정)이므로, 정식 판매 전에 pid.codes에서
#    PID를 무료로 할당받아 교체할 것.
#    BLE 장치명은 CONFIG_ZMK_KEYBOARD_NAME("KSN2")을 그대로 쓰므로
#    이 변경으로 블루투스 재페어링이 필요하지는 않음.
#    단, Windows에서는 VID/PID가 바뀌면 새 장치로 재열거됨.
CONFIG_USB_DEVICE_MANUFACTURER="Nexplit"
CONFIG_USB_DEVICE_PRODUCT="Nexplit KSN-2"
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x4B54

# 5) CDC-ACM(USB 시리얼) 로깅은 정식 빌드에 절대 넣지 않음. 로깅이 필요하면
#    build.yaml의 ksn_2_*_debug 아티팩트(zmk-usb-logging snippet)를 따로
#    빌드해서 회사 PC가 아닌 곳에서 사용할 것. 디버그 빌드도 같은 VID/PID를
#    쓰므로 화이트리스트를 통과하면서 CDC 시리얼을 노출하게 됨에 주의.
# ============================================================================
